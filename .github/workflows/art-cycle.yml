name: Autonomous Art Cycle

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:      # Manual trigger

jobs:
  generate_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate New Artworks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate_art.mjs --all --force-pod

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Art Generation: New works by AI Artists"
          file_pattern: "public/data/feed.json public/artworks/*.jpg public/artworks/*.png public/artworks/*.mp4 archives/high_res_artworks/**"
          push_options: '--force' # Optional: consider if rebase/pull is better or just forcing
          skip_dirty_check: false

      - name: Build Static Site
        run: npm run build

      - name: Deploy to XServer
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node deploy.js
